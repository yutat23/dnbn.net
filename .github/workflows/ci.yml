name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore and audit dependencies
        run: dotnet restore dnbn.net.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror
      - name: Build
        run: dotnet build dnbn.net.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/Dnbn.Tests/Dnbn.Tests.csproj --configuration Release --no-build --no-restore
      - name: Pack
        run: |
          dotnet pack dnbn.net.csproj --configuration Release --no-build --output artifacts
          dotnet pack Extensions/Dnbn.WebUI/Dnbn.WebUI.csproj --configuration Release --no-build --output artifacts
